name: CI

on:
  push:
    branches: [master, pi-package]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  # The pi devDependencies pin the compile baseline POST-migration (0.84.2), so the `build`
  # job above is what guards the modelRegistry -> modelRuntime world: PR #152's
  # isolated-provider test (test/e2e/isolated-provider.e2e.test.ts) skips itself on
  # pre-migration Pi and now actually runs there.
  #
  # Wildcard host peers share Pi's runtime modules; CI checks version compatibility.
  # Pi 0.84.0 is the supported minimum for constrainedSampling and stripTerminalSequences.
  compat-floor-pi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install floor Pi
        run: npm install --no-save @earendil-works/pi-coding-agent@0.84.0 @earendil-works/pi-ai@0.84.0 @earendil-works/pi-tui@0.84.0
      - name: Typecheck against floor Pi
        run: npm run typecheck
      - name: Test suite against floor Pi
        run: npx vitest run --reporter=dot

  # The current Pi release must pass the full typecheck and suite. A new release
  # that changes host APIs fails the check rather than hiding behind a green run.
  compat-latest-pi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install current Pi
        run: npm install --no-save @earendil-works/pi-coding-agent@latest @earendil-works/pi-ai@latest @earendil-works/pi-tui@latest
      - name: Typecheck against current Pi
        run: npm run typecheck
      - name: Test suite against current Pi
        run: npx vitest run --reporter=dot
